server:
  port: 8082

spring:
  application:
    name: loan-service
  cloud:
    function:
      definition: accountOpened
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        accountOpened-in-0:
          destination: account-opened
          group: loan-service
        loanDisbursed-out-0:
          destination: loan-disbursed

services:
  account-service:
    url: http://localhost:8081
