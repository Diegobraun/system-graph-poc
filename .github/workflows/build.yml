name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test extractor
        run: mvn -B -f extractor/pom.xml package

      - name: Build and test MCP server
        run: mvn -B -f graph-mcp-server/pom.xml package

      - name: Attach extractor to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" extractor/target/graph-extractor.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
